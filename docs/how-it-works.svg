<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How jev-router decides: one call on the draft alone, a second with context only for continuations</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8a8a"/></marker>
  </defs>
  <rect width="880" height="300" rx="16" fill="#151515"/>

  <rect x="24" y="110" width="150" height="70" rx="10" fill="#232323" stroke="#3d3d3d"/>
  <text x="99" y="140" fill="#f2f2f2" font-size="15" text-anchor="middle" font-weight="600">Your draft</text>
  <text x="99" y="162" fill="#8a8a8a" font-size="13" text-anchor="middle">Route with Jev</text>

  <rect x="214" y="96" width="210" height="98" rx="10" fill="#232323" stroke="#5b7cfa"/>
  <text x="319" y="122" fill="#f2f2f2" font-size="15" text-anchor="middle" font-weight="600">Call 1: draft alone</text>
  <text x="319" y="144" fill="#8a8a8a" font-size="13" text-anchor="middle">model · effort · prod guard</text>
  <text x="319" y="162" fill="#8a8a8a" font-size="13" text-anchor="middle">names-a-model · continues?</text>
  <text x="319" y="182" fill="#5b7cfa" font-size="12" text-anchor="middle">~0.3 s · ~$0.00006</text>

  <path d="M174 145H210" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>

  <path d="M424 125C470 125 470 60 510 60" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="434" y="141" fill="#8a8a8a" font-size="12">continues ≥ 0.4</text>
  <path d="M424 165C470 165 470 230 510 230" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="434" y="159" fill="#8a8a8a" font-size="12">otherwise</text>

  <rect x="512" y="24" width="190" height="72" rx="10" fill="#232323" stroke="#3d3d3d"/>
  <text x="607" y="52" fill="#f2f2f2" font-size="15" text-anchor="middle" font-weight="600">Call 2: with context</text>
  <text x="607" y="74" fill="#8a8a8a" font-size="13" text-anchor="middle">last 2 prompts + last reply</text>

  <rect x="512" y="194" width="190" height="72" rx="10" fill="#232323" stroke="#3d3d3d"/>
  <text x="607" y="222" fill="#f2f2f2" font-size="15" text-anchor="middle" font-weight="600">Use call 1</text>
  <text x="607" y="244" fill="#8a8a8a" font-size="13" text-anchor="middle">"hi", "thanks!", standalone asks</text>

  <path d="M702 60C740 60 740 130 768 136" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M702 230C740 230 740 160 768 154" stroke="#8a8a8a" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

  <rect x="770" y="104" width="94" height="82" rx="10" fill="#232323" stroke="#3fb37f"/>
  <text x="817" y="134" fill="#f2f2f2" font-size="15" text-anchor="middle" font-weight="600">Policy</text>
  <text x="817" y="154" fill="#8a8a8a" font-size="12" text-anchor="middle">bars · step-up</text>
  <text x="817" y="170" fill="#8a8a8a" font-size="12" text-anchor="middle">guards → card</text>
</svg>
